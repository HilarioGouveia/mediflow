[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow"
version = "1.0.0"
description = "Agente Autônomo para Triagem, Extração e Roteamento de Documentos Clínicos com OCI Always Free"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
{ name = "Equipe MediFlow - Hackathon ONE G10" }
]
keywords = ["healthtech", "llm", "langgraph", "fastapi", "oci", "multimodal", "triage"]

dependencies = [
"pydantic>=2.7.0",
"pydantic-settings>=2.2.0",
"fastapi>=0.111.0",
"uvicorn[standard]>=0.29.0",
"python-multipart>=0.0.9",
"requests>=2.31.0",
"langgraph>=0.0.40",
"langchain-core>=0.1.40",
"google-genai>=2.31.0",
"openai>=1.25.0",
"oci>=2.125.0",
"cryptography>=41.0.0",
"streamlit[pdf,auth]>=1.57.0",
"python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.1.0",
"pytest-mock>=3.14.0",
"pytest-asyncio>=0.23.0",
"ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "application*", "infrastructure*", "presentation*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "demonstracao_cenarios.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
